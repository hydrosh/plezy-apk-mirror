# Salva questo file come: .github/workflows/sync.yml
# nel repo mirror che hai creato (es. "plezy-apk-mirror").
#
# Non serve nessun secret/token da configurare: usa il GITHUB_TOKEN
# automatico di GitHub Actions, a cui basta il permesso "contents: write"
# dichiarato qui sotto.

name: Mirror Plezy Android Releases

on:
  schedule:
    - cron: '0 * * * *'   # controlla ogni ora
  workflow_dispatch: {}    # permette anche di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Leggi ultima release upstream
        id: upstream
        run: |
          LATEST=$(curl -s https://api.github.com/repos/edde746/plezy/releases/latest)
          TAG=$(echo "$LATEST" | jq -r '.tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Controlla se è già mirrorata completamente
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            ASSET_COUNT=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets | length')
            if [ "$ASSET_COUNT" -ge 3 ]; then
              echo "Release $TAG già completa ($ASSET_COUNT asset)."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release $TAG esiste ma incompleta ($ASSET_COUNT asset), la completo."
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scarica, verifica ed estrai gli APK
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.tag }}"
          mkdir -p work && cd work

          RELEASE_JSON=$(curl -s "https://api.github.com/repos/edde746/plezy/releases/tags/$TAG")

          declare -A ARCHS=(
            [arm64-v8a]="plezy-android-arm64-v8a"
            [armeabi-v7a]="plezy-android-armeabi-v7a"
            [x86_64]="plezy-android-x86_64"
          )

          for arch in "${!ARCHS[@]}"; do
            base="${ARCHS[$arch]}"
            asset_name="${base}.tar.gz"

            URL=$(echo "$RELEASE_JSON" | jq -r --arg name "$asset_name" '.assets[] | select(.name==$name) | .browser_download_url')
            if [ -z "$URL" ] || [ "$URL" == "null" ]; then
              echo "Asset $asset_name non trovato nella release $TAG, salto."
              continue
            fi

            DIGEST=$(echo "$RELEASE_JSON" | jq -r --arg name "$asset_name" '.assets[] | select(.name==$name) | .digest // ""')
            EXPECTED_SHA=${DIGEST#sha256:}

            echo "Scarico $asset_name..."
            curl -sL -o "$asset_name" "$URL"

            if [ -n "$EXPECTED_SHA" ]; then
              ACTUAL_SHA=$(sha256sum "$asset_name" | cut -d' ' -f1)
              if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
                echo "ERRORE: checksum non corrispondente per $asset_name"
                echo "Atteso:  $EXPECTED_SHA"
                echo "Ottenuto: $ACTUAL_SHA"
                exit 1
              fi
              echo "Checksum verificato per $asset_name."
            else
              echo "Nessun digest fornito da GitHub per $asset_name, salto la verifica."
            fi

            mkdir -p "extract_${arch}"
            tar -xzf "$asset_name" -C "extract_${arch}"
            rm -f "$asset_name"

            # Cerca l'apk direttamente (nel caso il tar.gz lo contenga già)
            apk_path=$(find "extract_${arch}" -iname "*.apk" | head -n1)

            # Altrimenti cerca un .tar annidato, qualunque sia il suo nome, ed estrailo
            if [ -z "$apk_path" ]; then
              inner_tar=$(find "extract_${arch}" -iname "*.tar" | head -n1)
              if [ -z "$inner_tar" ]; then
                echo "ERRORE: nessun .apk né .tar trovato per $arch"
                find "extract_${arch}"
                exit 1
              fi
              tar -xf "$inner_tar" -C "extract_${arch}"
              rm -f "$inner_tar"
              apk_path=$(find "extract_${arch}" -iname "*.apk" | head -n1)
            fi

            if [ -z "$apk_path" ]; then
              echo "ERRORE: nessun .apk trovato per $arch dopo l'estrazione"
              find "extract_${arch}"
              exit 1
            fi

            mv "$apk_path" "plezy-${arch}.apk"
            rm -rf "extract_${arch}"
          done

          ls -la

      - name: Pubblica release nel repo mirror (con retry)
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ steps.upstream.outputs.tag }}"
          REPO="${{ github.repository }}"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" \
              --notes "Mirror automatico degli APK Android estratti dalla release upstream: https://github.com/edde746/plezy/releases/tag/$TAG"
          else
            echo "Release $TAG già presente, aggiungo solo gli asset mancanti."
          fi

          for apk in work/plezy-*.apk; do
            name=$(basename "$apk")

            already=$(gh release view "$TAG" --repo "$REPO" --json assets --jq ".assets[].name" | grep -qx "$name" && echo yes || echo no)
            if [ "$already" == "yes" ]; then
              echo "$name già presente, salto."
              continue
            fi

            attempt=1
            max_attempts=5
            until gh release upload "$TAG" "$apk" --repo "$REPO"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "ERRORE: caricamento di $name fallito dopo $max_attempts tentativi."
                exit 1
              fi
              echo "Tentativo $attempt fallito per $name, riprovo tra 15s..."
              attempt=$((attempt + 1))
              sleep 15
            done
            echo "$name caricato correttamente."
          done